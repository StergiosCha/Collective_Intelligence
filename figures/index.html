<h1>Εικόνες και σχήματα</h1>
<p class="meta">Οι δύο εικόνες και τα έξι σχήματα του βιβλίου, με τη σειρά που εμφανίζονται.</p>
<figure><img src="../assets/img/frontispiece.jpg" width="1600" height="873" loading="lazy" alt="Εργοστάσιο υφαντουργίας με εργάτες στους αργαλειούς. Το ύφασμα που βγαίνει είναι φωτεινό μπλε, γεμάτο κείμενο και σύμβολα. Ψηλά σε μια γέφυρα στέκεται ένα ρομπότ κάτω από πινακίδα «API»."><figcaption><b>Προμετωπίδα.</b> Ο γενικός νους ως ύφασμα. Εικόνα παραγμένη με γενετικό μοντέλο.</figcaption></figure>
<figure><img src="../assets/img/fig-0-1.png" width="1600" height="837" loading="lazy" alt="Διάγραμμα με τη διαδρομή ενός μοντέλου (σώμα κειμένων, εκπαίδευση, βάρη, χρήση) και πίνακας με το τι από αυτά είναι διαθέσιμο σε κλειστά, ανοιχτών βαρών και πλήρως ανοιχτά μοντέλα."><figcaption><b>Σχήμα 0.1.</b> Τι ακριβώς κρύβει ένα κλειστό μοντέλο. Κεφάλαιο 0.</figcaption></figure>
<figure><img src="../assets/img/fig-0-2.png" width="1600" height="837" loading="lazy" alt="Η φράση «ΜΓΜ όλων των χωρών ενωθείτε!» κομμένη σε tokens από τέσσερα μοντέλα: 9 στο Meltemi, 13 στο GPT-4o, 16 στο DeepSeek-V3 και 30 στο GPT-4."><figcaption><b>Σχήμα 0.2.</b> Η ίδια πρόταση σε τέσσερα λεξιλόγια. Κεφάλαιο 0.</figcaption></figure>
<figure><img src="../assets/img/fig-0-3.png" width="1600" height="730" loading="lazy" alt="Μια πρόταση με γραμμές διαφορετικού πάχους κάτω από κάθε λέξη, που δείχνουν πόσο μετράει η καθεμία για τη μαντεψιά της επόμενης λέξης."><figcaption><b>Σχήμα 0.3.</b> Πού «κοιτάζει» το μοντέλο πριν μαντέψει. Κεφάλαιο 0.</figcaption></figure>
<figure><img src="../assets/img/fig-4-1.png" width="1600" height="1042" loading="lazy" alt="Καμπύλη που κατεβαίνει: ο μοχλός της ικανότητας άρνησης μικραίνει όσο αυτοματοποιείται η δεξιότητα. Πάνω της σημειώνονται οι προγραμματιστές COBOL, τα σημερινά επαγγέλματα και οι Λουδίτες."><figcaption><b>Σχήμα 4.1.</b> Το παράθυρο του διακανονισμού. Κεφάλαιο 4.</figcaption></figure>
<figure><img src="../assets/img/fig-5-1.png" width="1600" height="1055" loading="lazy" alt="Διάγραμμα του εκτιμώμενου κόστους εκπαίδευσης μοντέλων από το 2020 ως το 2025, σε λογαριθμική κλίμακα, με μια γραμμή για τα ακριβότερα μοντέλα και μια για τα φθηνότερα."><figcaption><b>Σχήμα 5.1.</b> Το δάπεδο κατεβαίνει, το μέτωπο ξεφεύγει (σημεία: εκτιμήσεις Epoch AI, 12.7.2026). Κεφάλαιο 5.</figcaption></figure>
<figure><img src="../assets/img/fig-9-1.png" width="1600" height="1067" loading="lazy" alt="Πυραμίδα με τέσσερα στρώματα, από πάνω προς τα κάτω: εταιρικός πυρήνας, πανεπιστήμια-ελίτ, εθνικές υποδομές, ακαδημαϊκή περιφέρεια."><figcaption><b>Σχήμα 9.1.</b> Η πυραμίδα της υπολογιστικής ισχύος. Κεφάλαιο 9.</figcaption></figure>
<figure><img src="../assets/img/closing.jpg" width="1600" height="873" loading="lazy" alt="Ασπρόμαυρο ερειπωμένο εργοστάσιο. Ένας ηλικιωμένος εργάτης κάθεται μόνος σε έναν αργαλειό που βγάζει οθόνες με διαγράμματα. Ψηλά σε μια γέφυρα στέκεται μια γυναίκα με κόκκινο παλτό."><figcaption><b>Κατακλείδα.</b> «Στον πάτο δεν απομένει τίποτα προς διαπραγμάτευση.» Εικόνα παραγμένη με γενετικό μοντέλο.</figcaption></figure>
